name: GitHub Classroom Workflow

on: [push]

jobs:
  build-linux:
    permissions: write-all
    name: Autograding
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Set PYTHONPATH to see project modules
      run: |
         echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV
    - name: Install dependencies
      run: |
        pip3 install -q -r .devcontainer/requirements.txt
    - name: Force Javascript 24
      run: |
         echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

    - name: Show Python versions
      id: show-python-versions
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Show Python versions'
        setup-command: ''
        command: 'python src/python_versions.py'
        timeout: '10'
        max-score: '0'


    - name: Test Assignment Notebook runs all cells cleanly
      id: test-assignment-notebook
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Assignment Notebook'
        working-directory: './notebooks'
        setup-command: ''
        command: 'jupyter nbconvert --execute Assg-04-NN-Generalization-and-Regularization.ipynb --to notebook'
        timeout: '10'
        max-score: '10'

    - name: Task 1 EveryNEpochs callback
      id: test-task-1
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Task 1 EveryNEpochs callback'
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_EveryNEpochs_callback'
        timeout: '10'
        max-score: '15'

    - name: Task 2 get_unregularized_model()
      id: test-task-2
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Task 2 get_unregularized_model()'
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_get_unregularized_model'
        timeout: '10'
        max-score: '15'

    - name: Task 4 get_l2_regularized_model()
      id: test-task-4
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Task 4 get_l2_regularized_model()'
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_get_l2_regularized_model'
        timeout: '10'
        max-score: '15'

    - name: Task 5 get_dropout_model()
      id: test-task-5
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Task 5 get_dropout_model()'
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_get_dropout_model'
        timeout: '10'
        max-score: '15'

    - name: Autograding Reporter
      uses: education/autograding-grading-reporter@v1
      env:
        TEST-ASSIGNMENT-NOTEBOOK_RESULTS: "${{steps.test-assignment-notebook.outputs.result}}"
        TEST-TASK-1_RESULTS: "${{steps.test-task-1.outputs.result}}"
        TEST-TASK-2_RESULTS: "${{steps.test-task-2.outputs.result}}"
        TEST-TASK-4_RESULTS: "${{steps.test-task-4.outputs.result}}"
        TEST-TASK-5_RESULTS: "${{steps.test-task-5.outputs.result}}"
      with:
        runners: test-assignment-notebook,test-task-1,test-task-2,test-task-4,test-task-5
